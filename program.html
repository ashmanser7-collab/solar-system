<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Program</title>
</head>
<style>
html::-webkit-scrollbar, 
body::-webkit-scrollbar {
  display: none;
}
</style>
<body style="margin: 0;">
    <canvas id="canvas" style="display: block;"></canvas>

    <script>
        const PARENT_ORIGIN = document.referrer
            ? new URL(document.referrer).origin
            : null;
        const LIVE_VARIABLES = new Set(["timeStep", "stepsperrender"]);

        const sendToParent = message => {
            if (PARENT_ORIGIN) parent.postMessage(message, PARENT_ORIGIN);
        };

        const params = new URLSearchParams(window.location.search);

        const width = Number(params.get("width")) || 600;
        const height = Number(params.get("height")) || 600;

        const stepsperrender = Number(params.get("stepsperrender")) || 1;
        const timeStep = Number(params.get("timeStep")) || 86400;
        const scale = Number(params.get("scale")) || 4.4951e-13;

        const canvas = document.getElementById("canvas");
        canvas.width = width;
        canvas.height = height;

        let firstOutputLogged = false;
        var Module = {
            canvas,
            programWidth: width,
            programHeight: height,
            stepsperrender: stepsperrender,
            timeStep: timeStep,
            scale: scale,
            onRuntimeInitialized: () => {
                sendToParent({ type: "program-ready" });
            },
            print: text => {
                if (!firstOutputLogged) {
                    console.debug("Module.print called:", text);
                    firstOutputLogged = true;
                }
                sendToParent({ type: "emscripten-output", stream: "stdout", text });
            },
            printErr: text => {
                if (!firstOutputLogged) {
                    console.debug("Module.printErr called:", text);
                    firstOutputLogged = true;
                }
                sendToParent({ type: "emscripten-output", stream: "stderr", text });
            }
            
        };
        window.addEventListener("message", event => {
            if (!PARENT_ORIGIN || event.source !== parent || event.origin !== PARENT_ORIGIN) return;
        
            const message = event.data;
            if (message?.type !== "set-variable") return;
            if (!LIVE_VARIABLES.has(message.id)) return;
            if (typeof message.value !== "number" || !Number.isFinite(message.value)) return;
        
            Module[message.id] = message.value;
        });
        if (message?.type === "download-canvas") {
            canvas.toBlob(blob => {
                if (!blob) {console.log("Not blob..."); return;}
            
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.download = "simulation.png";
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, "image/png");
            return;
        }

    </script>

    <script src="index.js"></script>
</body>
</html>
